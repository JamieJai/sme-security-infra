---
- name: Replace Nextcloud self-signed certificate
  hosts: nextcloud_server
  become: true

  vars:
    nextcloud_tls_cert_src: "{{ lookup('env', 'NEXTCLOUD_TLS_CERT_SRC') }}"
    nextcloud_tls_key_src: "{{ lookup('env', 'NEXTCLOUD_TLS_KEY_SRC') }}"
    nextcloud_tls_chain_src: "{{ lookup('env', 'NEXTCLOUD_TLS_CHAIN_SRC') }}"
    nextcloud_ssl_cert: /etc/ssl/certs/nextcloud.crt
    nextcloud_ssl_key: /etc/ssl/private/nextcloud.key
    nextcloud_ssl_chain: /etc/ssl/certs/nextcloud-chain.crt

  tasks:
    - name: Ensure certificate source files are provided
      ansible.builtin.assert:
        that:
          - nextcloud_tls_cert_src | length > 0
          - nextcloud_tls_key_src | length > 0
        fail_msg: "Set NEXTCLOUD_TLS_CERT_SRC and NEXTCLOUD_TLS_KEY_SRC before running this playbook."

    - name: Install Nextcloud certificate
      ansible.builtin.copy:
        src: "{{ nextcloud_tls_cert_src }}"
        dest: "{{ nextcloud_ssl_cert }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install Nextcloud private key
      ansible.builtin.copy:
        src: "{{ nextcloud_tls_key_src }}"
        dest: "{{ nextcloud_ssl_key }}"
        owner: root
        group: ssl-cert
        mode: "0640"
      no_log: true

    - name: Install optional certificate chain
      ansible.builtin.copy:
        src: "{{ nextcloud_tls_chain_src }}"
        dest: "{{ nextcloud_ssl_chain }}"
        owner: root
        group: root
        mode: "0644"
      when: nextcloud_tls_chain_src | length > 0

    - name: Configure Apache HTTPS vhost with provided certificate
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/nextcloud-ssl.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          <VirtualHost *:443>
            ServerName nextcloud.toss.lan
            ServerAlias 192.168.0.50
            DocumentRoot /var/www/nextcloud/
            SSLEngine on
            SSLCertificateFile {{ nextcloud_ssl_cert }}
            SSLCertificateKeyFile {{ nextcloud_ssl_key }}
          {% if nextcloud_tls_chain_src | length > 0 %}
            SSLCertificateChainFile {{ nextcloud_ssl_chain }}
          {% endif %}
            <Directory /var/www/nextcloud/>
              Require all granted
              AllowOverride All
              Options FollowSymLinks MultiViews
              <IfModule mod_dav.c>
                Dav off
              </IfModule>
            </Directory>
            ErrorLog ${APACHE_LOG_DIR}/nextcloud-ssl-error.log
            CustomLog ${APACHE_LOG_DIR}/nextcloud-ssl-access.log combined
          </VirtualHost>

    - name: Enable Apache SSL modules
      ansible.builtin.command:
        cmd: a2enmod ssl headers rewrite
      register: apache_ssl_modules
      changed_when: "'Enabling' in apache_ssl_modules.stdout"

    - name: Enable Nextcloud HTTPS site
      ansible.builtin.command:
        cmd: a2ensite nextcloud-ssl.conf
        creates: /etc/apache2/sites-enabled/nextcloud-ssl.conf

    - name: Set Nextcloud HTTPS overwrite settings
      ansible.builtin.command:
        cmd: "sudo -u www-data php /var/www/nextcloud/occ config:system:set {{ item.key }} --value={{ item.value }}"
      loop:
        - { key: overwrite.cli.url, value: "https://192.168.0.50" }
        - { key: overwriteprotocol, value: "https" }
      changed_when: true

    - name: Reload Apache
      ansible.builtin.systemd:
        name: apache2
        state: reloaded
