---
- name: Install Wazuh Agent
  hosts: all:!wazuh_server
  become: true

  vars:
    wazuh_manager_ip: "192.168.0.30"

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - gnupg2
        state: present
        update_cache: yes

    - name: Download Wazuh armored signing key
      ansible.builtin.get_url:
        url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        dest: /tmp/GPG-KEY-WAZUH
        mode: '0644'

    - name: Install Wazuh signing keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes --output /usr/share/keyrings/wazuh.gpg /tmp/GPG-KEY-WAZUH
      changed_when: false

    - name: Add Wazuh repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        filename: wazuh
        state: present

    - name: Remove legacy Wazuh repository file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/packages_wazuh_com_4_x_apt.list
        state: absent

    - name: Install Wazuh Agent (Fixed Version)
      ansible.builtin.apt:
        name: wazuh-agent=4.10.4-1
        state: present
        update_cache: yes
        allow_downgrade: yes

    - name: Hold Wazuh Agent at manager-compatible version
      ansible.builtin.dpkg_selections:
        name: wazuh-agent
        selection: hold

    - name: Configure Wazuh Manager IP
      ansible.builtin.lineinfile:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*</address>'
        line: "      <address>{{ wazuh_manager_ip }}</address>"
      notify: Restart Wazuh Agent

    - name: Enable and start Wazuh Agent
      ansible.builtin.systemd:
        name: wazuh-agent
        state: started
        enabled: yes

  handlers:
    - name: Restart Wazuh Agent
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
