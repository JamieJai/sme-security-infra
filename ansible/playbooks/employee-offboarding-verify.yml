---
- name: Validate employee offboarding verification inputs
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Require the employee username
      ansible.builtin.assert:
        that:
          - offboard_user_name is defined
          - offboard_user_name is match('^[a-z0-9][a-z0-9._-]{0,63}$')
        fail_msg: Set a valid offboard_user_name.

- name: Verify AD account and managed access containment
  hosts: active_dc
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Read the offboarded AD user
      ansible.builtin.command:
        argv:
          - samba-tool
          - user
          - show
          - "{{ offboard_user_name }}"
          - --attributes=userAccountControl
          - --color=never
      register: offboarding_verify_ad_user
      changed_when: false

    - name: Read the resulting AD user account control value
      ansible.builtin.set_fact:
        offboarding_verify_ad_uac: >-
          {{
            (
              offboarding_verify_ad_user.stdout
              | regex_findall(
                '(?m)^userAccountControl:[ ]*([0-9]+)[ ]*$'
              )
              | first
            )
            | int
          }}

    - name: Verify the AD user is disabled
      ansible.builtin.assert:
        that:
          - ((offboarding_verify_ad_uac | int) // 2) % 2 == 1
        fail_msg: "AD account {{ offboard_user_name }} is still enabled."

    - name: Read managed group memberships
      ansible.builtin.command:
        argv: [samba-tool, group, listmembers, "{{ item }}"]
      loop: "{{ nextcloud_oidc_department_groups }}"
      register: offboarding_verify_group_members
      changed_when: false

    - name: Verify managed group access was removed
      ansible.builtin.assert:
        that:
          - offboard_user_name not in item.stdout_lines
        fail_msg: >-
          {{ offboard_user_name }} remains in managed group {{ item.item }}.
      loop: "{{ offboarding_verify_group_members.results }}"

- name: Verify Keycloak sessions were revoked
  hosts: iam_server
  become: true
  gather_facts: false
  vars:
    keycloak_path: /opt/keycloak
    keycloak_realm: homelab
    keycloak_admin_user: admin
  tasks:
    - name: Read Keycloak admin password from systemd
      ansible.builtin.shell: >-
        systemctl show keycloak -p Environment --value
        | xargs -n1
        | grep ^KEYCLOAK_ADMIN_PASSWORD=
        | cut -d= -f2-
        | tail -1
      register: offboarding_verify_keycloak_admin_password
      changed_when: false
      no_log: true

    - name: Authenticate to Keycloak Admin CLI
      ansible.builtin.command:
        argv:
          - "{{ keycloak_path }}/bin/kcadm.sh"
          - config
          - credentials
          - --server
          - http://localhost:8080
          - --realm
          - master
          - --user
          - "{{ keycloak_admin_user }}"
          - --password
          - "{{ offboarding_verify_keycloak_admin_password.stdout }}"
      changed_when: false
      no_log: true

    - name: Read realm client session statistics
      ansible.builtin.command:
        argv:
          - "{{ keycloak_path }}/bin/kcadm.sh"
          - get
          - client-session-stats
          - -r
          - "{{ keycloak_realm }}"
      register: offboarding_verify_keycloak_session_stats
      changed_when: false
      no_log: true

    - name: Initialize remaining Keycloak session inventory
      ansible.builtin.set_fact:
        offboarding_verify_keycloak_sessions: []

    - name: Read remaining user sessions from each client
      ansible.builtin.command:
        argv:
          - "{{ keycloak_path }}/bin/kcadm.sh"
          - get
          - "clients/{{ item.id }}/user-sessions"
          - -r
          - "{{ keycloak_realm }}"
      loop: >-
        {{ offboarding_verify_keycloak_session_stats.stdout | from_json }}
      register: offboarding_verify_keycloak_client_sessions
      changed_when: false
      when: item.active | int > 0
      no_log: true

    - name: Combine remaining Keycloak client sessions
      ansible.builtin.set_fact:
        offboarding_verify_keycloak_sessions: >-
          {{
            offboarding_verify_keycloak_sessions
            + (item.stdout | from_json)
          }}
      loop: "{{ offboarding_verify_keycloak_client_sessions.results }}"
      when: not (item.skipped | default(false))
      no_log: true

    - name: Verify no exact Keycloak user session remains
      ansible.builtin.assert:
        that:
          - >-
            offboarding_verify_keycloak_sessions
            | selectattr('username', 'defined')
            | selectattr('username', 'equalto', offboard_user_name)
            | list
            | length == 0
        fail_msg: "Keycloak sessions remain for {{ offboard_user_name }}."
      no_log: true

- name: Verify the matching Nextcloud user is disabled when present
  hosts: nextcloud_server
  become: true
  gather_facts: false
  vars:
    nextcloud_occ: /var/www/nextcloud/occ
  tasks:
    - name: Read the matching Nextcloud user
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - www-data
          - php
          - "{{ nextcloud_occ }}"
          - user:info
          - "{{ offboard_user_name }}"
      register: offboarding_verify_nextcloud_user
      failed_when: false
      changed_when: false

    - name: Verify the matching Nextcloud user is disabled
      ansible.builtin.assert:
        that:
          - "'enabled: false' in offboarding_verify_nextcloud_user.stdout"
        fail_msg: "Nextcloud user {{ offboard_user_name }} remains enabled."
      when: offboarding_verify_nextcloud_user.rc == 0
