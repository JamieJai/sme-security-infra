---
- name: Install dependencies for Wazuh
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - lsb-release
      - gnupg2
    state: present
    update_cache: yes

- name: Download Wazuh installation script
  ansible.builtin.get_url:
    url: "{{ wazuh_install_script_url }}"
    dest: /tmp/wazuh-install.sh
    checksum: "{{ wazuh_install_script_checksum }}"
    mode: '0755'

- name: Run Wazuh all-in-one installation script
  ansible.builtin.command:
    cmd: bash /tmp/wazuh-install.sh -a
    creates: /var/ossec/bin/wazuh-control
  register: wazuh_install_result
  notify: Restart Wazuh

- name: Hold Wazuh components at the validated version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - wazuh-manager
    - wazuh-indexer
    - wazuh-dashboard

- name: Allow Wazuh internal ports in UFW
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: "{{ wazuh_trusted_network }}"
  loop:
    - 1514  # Agent connection
    - 1515  # Agent registration
    - 443   # Wazuh Dashboard
