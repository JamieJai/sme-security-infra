---
- name: Install LAMP and NFS dependencies
  ansible.builtin.apt:
    name:
      - apache2
      - mariadb-server
      - libapache2-mod-php
      - php-gd
      - php-mysql
      - php-curl
      - php-mbstring
      - php-intl
      - php-gmp
      - php-bcmath
      - php-xml
      - php-zip
      - php-imagick
      - unzip
      - python3-pymysql
      - php-smbclient
      - nfs-common
      - cifs-utils
      - cron
    state: present
    update_cache: yes

- name: Create mount point
  ansible.builtin.file:
    path: /mnt/storage01
    state: directory

- name: Mount NFS share
  ansible.posix.mount:
    path: /mnt/storage01
    src: 192.168.0.70:/data/shared
    fstype: nfs
    state: mounted

- name: Start and enable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - apache2
    - mariadb
    - cron

- name: Create MariaDB database for Nextcloud
  community.mysql.mysql_db:
    name: "{{ nextcloud_db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create MariaDB user for Nextcloud
  community.mysql.mysql_user:
    name: "{{ nextcloud_db_user }}"
    password: "{{ vault_nextcloud_db_password }}"
    priv: "{{ nextcloud_db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Download Nextcloud
  ansible.builtin.get_url:
    url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.zip"
    dest: "/tmp/nextcloud-{{ nextcloud_version }}.zip"

- name: Remove existing Nextcloud directory
  ansible.builtin.file:
    path: /var/www/nextcloud
    state: absent

- name: Extract Nextcloud
  ansible.builtin.unarchive:
    src: "/tmp/nextcloud-{{ nextcloud_version }}.zip"
    dest: /var/www/
    remote_src: yes

- name: Set permissions for Nextcloud
  ansible.builtin.file:
    path: /var/www/nextcloud
    owner: www-data
    group: www-data
    recurse: yes
    state: directory

- name: Install Nextcloud automatically
  ansible.builtin.shell: >
    sudo -u www-data php /var/www/nextcloud/occ maintenance:install 
    --database="mysql" 
    --database-name="{{ nextcloud_db_name }}" 
    --database-user="{{ nextcloud_db_user }}" 
    --database-pass="{{ vault_nextcloud_db_password }}" 
    --admin-user="{{ nextcloud_admin_user }}" 
    --admin-pass="{{ vault_nextcloud_admin_password }}"
  args:
    creates: /var/www/nextcloud/config/config.php

- name: Configure Nextcloud background jobs to use cron
  ansible.builtin.command:
    cmd: sudo -u www-data php /var/www/nextcloud/occ background:cron
  register: nextcloud_background_mode
  changed_when: "'Set mode' in nextcloud_background_mode.stdout"

- name: Schedule Nextcloud background jobs
  ansible.builtin.cron:
    name: nextcloud-background-jobs
    user: www-data
    minute: "*/5"
    job: php -f /var/www/nextcloud/cron.php

- name: Configure Apache for Nextcloud
  ansible.builtin.template:
    src: nextcloud.conf.j2
    dest: /etc/apache2/sites-available/nextcloud.conf
  notify: Restart Apache

- name: Enable Nextcloud site
  ansible.builtin.command:
    cmd: a2ensite nextcloud.conf
    creates: /etc/apache2/sites-enabled/nextcloud.conf
  notify: Restart Apache

- name: Disable default Apache site
  ansible.builtin.command:
    cmd: a2dissite 000-default.conf
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Restart Apache

- name: Enable Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - rewrite
    - headers
    - env
    - dir
    - mime
  notify: Restart Apache

- name: Set trusted domains
  ansible.builtin.shell: |
    sudo -u www-data php /var/www/nextcloud/occ config:system:set trusted_domains 0 --value=192.168.0.50
    sudo -u www-data php /var/www/nextcloud/occ config:system:set trusted_domains 1 --value=nextcloud.toss.lan
  args:
    executable: /bin/bash

- name: Enable external storage app
  ansible.builtin.shell: sudo -u www-data php /var/www/nextcloud/occ app:enable files_external
  args:
    executable: /bin/bash

- name: Add NFS external storage
  ansible.builtin.shell:
    cmd: >
      sudo -u www-data php /var/www/nextcloud/occ files_external:create 
      "nfs_storage" local null::null 
      --config="datadir=/mnt/storage01"
  args:
    executable: /bin/bash
  register: nfs_mount
  changed_when: "'Created' in nfs_mount.stdout"
  failed_when: nfs_mount.rc != 0 and 'already exists' not in nfs_mount.stderr

- name: Allow HTTP/HTTPS in UFW
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443
