---
- name: Check whether this host is already joined as a DC
  ansible.builtin.stat:
    path: /var/lib/samba/private/secrets.ldb
  register: samba_dc_database

- name: Require explicit confirmation and an empty Samba database for rebuilds
  ansible.builtin.assert:
    that:
      - rebuild_dc_confirm | default(false) | bool
      - not samba_dc_database.stat.exists
    fail_msg: "Rebuild requires -e rebuild_dc_confirm=true and pre-cleaned Samba DC state."
  when: require_empty_samba_database | default(false) | bool

- name: Set temporary DNS to bootstrap DC
  ansible.builtin.copy:
    content: |
      nameserver {{ bootstrap_dc_ip | default('192.168.0.20') }}
      search {{ ad_realm | lower }}
    dest: /etc/resolv.conf
    mode: '0644'
  when: not samba_dc_database.stat.exists

- name: Install Samba AD DC packages
  ansible.builtin.apt:
    name:
      - samba-ad-dc
      - krb5-user
      - winbind
      - smbclient
      - dnsutils
      - chrony
    state: present
    update_cache: yes

- name: Stop and mask conflicting services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
    masked: yes
  loop:
    - smbd
    - nmbd
    - winbind

- name: Remove existing smb.conf
  ansible.builtin.file:
    path: /etc/samba/smb.conf
    state: absent
  when: not samba_dc_database.stat.exists

- name: Wait for DNS to be reachable
  ansible.builtin.command: ping -c 2 archive.ubuntu.com
  register: ping_test
  retries: 10
  delay: 5
  until: ping_test.rc == 0
  changed_when: false
  when: not samba_dc_database.stat.exists

- name: Verify bootstrap DC DNS resolution
  ansible.builtin.command: host {{ bootstrap_dc_host | default('dc01') }}.{{ ad_realm | lower }} {{ bootstrap_dc_ip | default('192.168.0.20') }}
  changed_when: false
  when: not samba_dc_database.stat.exists

- name: Join existing Samba Domain as Additional DC
  ansible.builtin.command: >
    samba-tool domain join {{ ad_realm | lower }} DC
      -U{{ ad_domain }}\\Administrator%{{ ad_admin_password }}
      --use-kerberos=off
      --realm={{ ad_realm }}
      --dns-backend=SAMBA_INTERNAL
      --option="interfaces=lo eth0"
      --option="bind interfaces only=yes"
  args:
    creates: /var/lib/samba/private/secrets.ldb
  no_log: true
  when: not samba_dc_database.stat.exists

- name: Copy Kerberos config
  ansible.builtin.copy:
    src: /var/lib/samba/private/krb5.conf
    dest: /etc/krb5.conf
    remote_src: yes
    mode: '0644'

- name: Set final resolv.conf to use Samba DNS
  ansible.builtin.copy:
    content: |
      nameserver 127.0.0.1
      search {{ ad_realm | lower }}
    dest: /etc/resolv.conf
    mode: '0644'

- name: Disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: no

- name: Configure Chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
  notify: Restart chrony

- name: Restart samba-ad-dc service
  ansible.builtin.systemd:
    name: samba-ad-dc
    state: started
    enabled: yes
