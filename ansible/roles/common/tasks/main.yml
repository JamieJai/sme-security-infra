---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Map the host FQDN to its LAN address
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "{{ ansible_host }} {{ inventory_hostname }}.{{ domain_name }} {{ inventory_hostname }}"

- name: Check for the cloud-init hosts template
  ansible.builtin.stat:
    path: /etc/cloud/templates/hosts.debian.tmpl
  register: cloud_init_hosts_template

- name: Persist the LAN host mapping in the cloud-init template
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: '^127\.0\.1\.1'
    line: "{{ ansible_host }} {{ inventory_hostname }}.{{ domain_name }} {{ inventory_hostname }}"
  when: cloud_init_hosts_template.stat.exists

- name: Add core infrastructure hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      192.168.0.20 dc01.toss.lan dc01
      192.168.0.21 dc02.toss.lan dc02
      192.168.0.30 wazuh.toss.lan wazuh
      192.168.0.40 automation01.toss.lan automation01
      192.168.0.50 nextcloud.toss.lan nextcloud01
      192.168.0.60 windows-test.toss.lan windows-test
      192.168.0.70 storage01.toss.lan storage01
      192.168.0.80 mail01.toss.lan mail01
    create: yes
    state: present


- name: Set timezone to Asia/Seoul
  ansible.builtin.timezone:
    name: "{{ timezone }}"

- name: Update apt packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
    autoremove: yes

- name: Install basic tools
  ansible.builtin.apt:
    name:
      - curl
      - git
      - htop
      - net-tools
      - dnsutils
      - chrony
      - ufw
      - fail2ban
      - vim
      - iputils-ping
    state: present

- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: yes
    daemon_reload: true

- name: Allow SSH in UFW
  ansible.builtin.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Enable UFW
  ansible.builtin.ufw:
    state: enabled
    policy: deny
