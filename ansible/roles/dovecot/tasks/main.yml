- name: Install dovecot packages
  ansible.builtin.apt:
    name:
      - dovecot-core
      - dovecot-imapd
      - dovecot-pop3d
      - dovecot-lmtpd
      - dovecot-ldap
      - ldap-utils
    state: present
    update_cache: yes

- name: Read Samba AD CA certificates from both domain controllers
  ansible.builtin.slurp:
    src: /var/lib/samba/private/tls/ca.pem
  delegate_to: "{{ item }}"
  loop: "{{ groups['primary_dc'] + groups['secondary_dc'] }}"
  register: dovecot_ad_ca_certificates

- name: Trust Samba AD CA certificates
  ansible.builtin.copy:
    dest: "/usr/local/share/ca-certificates/toss-ad-{{ item.item }}-ca.crt"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content | b64decode }}"
  loop: "{{ dovecot_ad_ca_certificates.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: dovecot_ad_ca_copy

- name: Update the OS CA trust store
  ansible.builtin.command:
    cmd: update-ca-certificates
  when: dovecot_ad_ca_copy.changed
  notify: restart dovecot

- name: Deploy mail config
  ansible.builtin.template:
    src: 10-mail.conf.j2
    dest: /etc/dovecot/conf.d/10-mail.conf
  notify: restart dovecot

- name: Deploy special-use mailbox config
  ansible.builtin.template:
    src: 15-mailboxes.conf.j2
    dest: /etc/dovecot/conf.d/15-mailboxes.conf
  notify: restart dovecot

- name: Deploy auth config
  ansible.builtin.template:
    src: 10-auth.conf.j2
    dest: /etc/dovecot/conf.d/10-auth.conf
  notify: restart dovecot

- name: Deploy LDAP config
  ansible.builtin.template:
    src: dovecot-ldap.conf.ext.j2
    dest: /etc/dovecot/dovecot-ldap.conf.ext
    mode: "0600"
  notify: restart dovecot

- name: Deploy LMTP config
  ansible.builtin.template:
    src: 10-master.conf.j2
    dest: /etc/dovecot/conf.d/10-master.conf
  notify: restart dovecot

- name: Ensure dovecot is running
  ansible.builtin.systemd:
    name: dovecot
    state: started
    enabled: true